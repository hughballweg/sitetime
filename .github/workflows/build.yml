name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q sitetime-project.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp src/app/build/outputs/apk/debug/app-debug.apk "SiteTime-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SiteTime-apk
          path: SiteTime-*.apk

      - name: Publish to Releases (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "SiteTime-${{ github.run_number }}.apk" \
            --title "Site Time build ${{ github.run_number }}" \
            --notes "Download the .apk below on your phone and open it to install."
